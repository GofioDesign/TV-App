name: Audit generic hardcodes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-hardcodes.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/generic-engine
          fetch-depth: 0
      - name: Audit
        run: |
          {
            echo '# Instance-specific hardcode audit'
            echo
            echo '## Archipielago strings outside presets'
            grep -RniE 'Archipi[eé]lago Vivo|archipielagovivo|ARCHIPI[EÉ]LAGO VIVO|AVAnalytics' web apps-script docs 2>/dev/null || true
          } > hardcode-audit.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardcode-audit.txt
          git commit -m "chore: add temporary hardcode audit" || exit 0
          git push origin HEAD:refactor/generic-engine
