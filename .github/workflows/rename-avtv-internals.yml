name: Rename legacy AVTV internals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-avtv-internals.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/generic-engine
          fetch-depth: 0
      - name: Rename globals
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['web/app.js', 'web/tv-engine.js', 'web/tv-player.js']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('AVTVEngine', 'TVAppEngine')
              s = s.replace('AVTVPlayer', 'TVAppPlayer')
              s = s.replace('avtv-provider-player', 'tvapp-provider-player')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js web/tv-engine.js web/tv-player.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: rename legacy AVTV globals to TVApp"
          git push origin HEAD:refactor/generic-engine
