name: Normalize instance asset configuration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-instance-config-assets.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/generic-engine
          fetch-depth: 0

      - name: Normalize JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          def save(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')

          generic_path = 'web/config.json'
          generic = load(generic_path)
          generic.setdefault('deployment', {})['cname'] = ''
          generic.setdefault('branding', {})['favicon'] = 'assets/tv-app.svg'
          generic['branding'].setdefault('icons', [])
          save(generic_path, generic)

          example_path = 'web/config.example.json'
          example = load(example_path)
          example.setdefault('deployment', {})['cname'] = 'tv.example.org'
          example.setdefault('backend', {
              'menu_name': 'My TV',
              'database_name': 'My TV — DB',
              'public_feed_target': 'https://data.example.org/tv/feed.json',
              'default_channel_id': 'general',
              'entity_program_id': 'entities',
              'default_status': 'Active',
              'request_pending_status': 'Pending',
              'media_status_active': 'Active',
              'media_status_inactive': 'Inactive',
              'media_status_retired': 'Retired',
              'media_status_pending_review': 'Pending review',
              'orphaned_relation_reason': 'orphaned_entity_relation',
              'entity_relation_type': 'entity_profile',
              'entity_media_source': 'entity-sync',
              'entity_media_sources': ['entity-sync'],
              'external_rights_allowed': ['embed_only', 'authorized'],
              'new_entity_hours': 72
          })
          example.setdefault('branding', {})['favicon'] = 'assets/favicon.ico'
          example['branding'].setdefault('icons', [
              {'src': 'assets/icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
              {'src': 'assets/icon-512.png', 'sizes': '512x512', 'type': 'image/png'}
          ])
          save(example_path, example)

          preset_path = 'presets/archipielago-vivo/app.config.json'
          preset = load(preset_path)
          preset.setdefault('deployment', {})['cname'] = 'tv.archipielagovivo.org'
          brand = preset.setdefault('branding', {})
          brand['logo'] = 'assets/logo.svg'
          brand['social_image'] = 'assets/logo-social-1200x630.png'
          brand['favicon'] = 'assets/favicon.ico'
          brand['icons'] = [
              {'src': 'assets/android-chrome-192x192.png', 'sizes': '192x192', 'type': 'image/png'},
              {'src': 'assets/android-chrome-512x512.png', 'sizes': '512x512', 'type': 'image/png'}
          ]
          save(preset_path, preset)
          PY

      - name: Normalize generic favicon and manifest builder
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('web/runtime-config.js')
          s = p.read_text().replace('favicon: "favicon.ico"', 'favicon: "assets/tv-app.svg"')
          p.write_text(s)

          p = Path('web/index.html')
          s = p.read_text().replace('href="favicon.ico" sizes="any"', 'href="assets/tv-app.svg" sizes="any"')
          p.write_text(s)

          p = Path('scripts/build-instance.js')
          s = p.read_text().replace('    icons: []\n  };', '    icons: Array.isArray(b.icons) ? b.icons : []\n  };')
          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/config.json web/config.example.json web/runtime-config.js web/index.html scripts/build-instance.js presets/archipielago-vivo/app.config.json
          git diff --cached --quiet && exit 0
          git commit -m "refactor: make branding and deployment assets config-driven"
          git push origin HEAD:refactor/generic-engine
