name: Apply generic customization refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-customization-app-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/generic-engine
          fetch-depth: 0

      - name: Patch app.js
        shell: python
        run: |
          from pathlib import Path
          path = Path('web/app.js')
          s = path.read_text()

          def replace(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected snippet not found:\n' + old[:300])
              s = s.replace(old, new)

          replace(
          '''    entities: { ...(base.entities || {}), ...(value.entities || {}) },
              analytics: { ...(base.analytics || {}), ...(value.analytics || {}) },
              branding: { ...(base.branding || {}), ...(value.branding || {}) }
            };''',
          '''    entities: { ...(base.entities || {}), ...(value.entities || {}) },
              analytics: { ...(base.analytics || {}), ...(value.analytics || {}) },
              branding: { ...(base.branding || {}), ...(value.branding || {}) },
              seo: { ...(base.seo || {}), ...(value.seo || {}) },
              publisher: { ...(base.publisher || {}), ...(value.publisher || {}) },
              navigation: { ...(base.navigation || {}), ...(value.navigation || {}) },
              ui: {
                ...(base.ui || {}),
                ...(value.ui || {}),
                labels: { ...((base.ui && base.ui.labels) || {}), ...((value.ui && value.ui.labels) || {}) },
                participation: { ...((base.ui && base.ui.participation) || {}), ...((value.ui && value.ui.participation) || {}) },
                share: { ...((base.ui && base.ui.share) || {}), ...((value.ui && value.ui.share) || {}) },
                intermission: { ...((base.ui && base.ui.intermission) || {}), ...((value.ui && value.ui.intermission) || {}) },
                continuity: { ...((base.ui && base.ui.continuity) || {}), ...((value.ui && value.ui.continuity) || {}) },
                errors: { ...((base.ui && base.ui.errors) || {}), ...((value.ui && value.ui.errors) || {}) },
                controls: { ...((base.ui && base.ui.controls) || {}), ...((value.ui && value.ui.controls) || {}) }
              }
            };''')

          replace(
          '''  async function loadAppConfig() {
              try {
                const loaded = await fetchJson("config.json");
                appConfig = mergeAppConfig(DEFAULT_APP_CONFIG, loaded);
              } catch (error) {
                appConfig = DEFAULT_APP_CONFIG;
                log("config", `No se pudo cargar config.json: ${error && error.message || error}`);
              }''',
          '''  async function loadAppConfig() {
              try {
                const loaded = window.TVAppConfig && window.TVAppConfig.ready
                  ? await window.TVAppConfig.ready
                  : await fetchJson("config.json");
                appConfig = mergeAppConfig(DEFAULT_APP_CONFIG, loaded);
              } catch (error) {
                appConfig = DEFAULT_APP_CONFIG;
                log("config", `Could not load config.json: ${error && error.message || error}`);
              }''')

          replace(
          '''  function firstText(...values) {
              for (const value of values) {
                const text = String(value == null ? "" : value).trim();
                if (text) return text;
              }
              return "";
            }''',
          '''  function firstText(...values) {
              for (const value of values) {
                const text = String(value == null ? "" : value).trim();
                if (text) return text;
              }
              return "";
            }

            function configValue(path, fallback = "") {
              const parts = String(path || "").split(".").filter(Boolean);
              let value = appConfig;
              for (const part of parts) {
                if (!value || typeof value !== "object" || !(part in value)) return fallback;
                value = value[part];
              }
              return value === undefined || value === null || value === "" ? fallback : value;
            }

            function formatTemplate(template, values) {
              return String(template || "").replace(/\\{([a-z0-9_]+)\\}/gi, (_, key) =>
                values && values[key] !== undefined && values[key] !== null ? String(values[key]) : ""
              ).replace(/\\s+/g, " ").trim();
            }

            function configuredLogo() {
              return firstText(configValue("branding.logo"), "assets/tv-app.svg");
            }''')

          replace('''        "una iniciativa"''', '''        configValue("ui.entity_fallback_name", "View profile")''')
          replace(
          '''        text: `Estoy viendo la presentación de ${entityName} en ${appConfig.name || "TV App"}`,
                url''',
          '''        text: formatTemplate(
                  configValue("ui.share.entity_template", "I'm watching the presentation of {entity} on {tv}"),
                  { entity: entityName, tv: appConfig.name || "TV App" }
                ),
                url''')

          replace(
          '''      "Archipiélago Vivo TV"
            );

            const topic = firstText(
              program && program.name,
              channel && channel.name,
              "Canarias"
            );

            return {
              title: emission,
              text: `Estoy viendo ${emission} sobre ${topic} en ${appConfig.name || "TV App"}`,
              url
            };''',
          '''      appConfig.name,
              "TV App"
            );

            const topic = firstText(
              program && program.name,
              channel && channel.name,
              configValue("ui.share.default_topic")
            );

            return {
              title: emission,
              text: formatTemplate(
                configValue("ui.share.generic_template", "I'm watching {emission} on {tv}"),
                { emission, topic, tv: appConfig.name || "TV App" }
              ),
              url
            };''')

          replace(
          '''    // Compartimos un único cuerpo de texto:
              // mensaje editorial + URL de Archipiélago Vivo TV.
              //
              // No adjuntamos miniaturas ni enviamos una URL separada a Web Share.
              // La preview social debe salir de los metadatos Open Graph del subdominio.''',
          '''    // Share a single editorial text body plus the configured TV URL.
              // Social previews are generated from the instance Open Graph metadata.''')

          replace('''        button.textContent = "Enlace copiado";''', '''        button.textContent = configValue("ui.share.copied", "Link copied");''')
          replace('''        "Copia este contenido para compartir la emisión:",''', '''        configValue("ui.share.copy_prompt", "Copy this content to share the broadcast:"),''')

          replace(
          '''  function trackTv(eventName, details = {}, includeTechnical = false) {
              if (!window.AVAnalytics || typeof window.AVAnalytics.track !== "function") return false;
              return window.AVAnalytics.track(
                eventName,
                includeTechnical ? { ...technicalContext(), ...details } : details
              );
            }''',
          '''  function trackTv(eventName, details = {}, includeTechnical = false) {
              const analytics = appConfig.analytics || {};
              if (analytics.enabled === false || !analytics.global_object) return false;
              const tracker = window[analytics.global_object];
              const method = analytics.track_method || "track";
              if (!tracker || typeof tracker[method] !== "function") return false;
              return tracker[method](
                eventName,
                includeTechnical ? { ...technicalContext(), ...details } : details
              );
            }''')

          replace('''          channel.channel_number ? `CANAL ${channel.channel_number}` : "",''', '''          channel.channel_number ? `${configValue("ui.channel_label", "CHANNEL")} ${channel.channel_number}` : "",''')
          replace('''      "Canal",
              channelText''', '''      configValue("ui.labels.channel", "Channel"),
              channelText''')
          replace('''      "Programa",
              program && firstText(''', '''      configValue("ui.labels.program", "Programme"),
              program && firstText(''')
          replace('''      "Ahora",
              media && firstText(''', '''      configValue("ui.labels.now", "Now"),
              media && firstText(''')
          replace('''          `${firstText(media && media.title, media && media.name, "Vídeo")} · abrir vídeo original`''', '''          formatTemplate(
                    configValue("ui.media_original_aria_template", "{title} · open original video"),
                    { title: firstText(media && media.title, media && media.name, configValue("ui.video_label", "Video")) }
                  )''')
          replace('''      "Entidad",
              entityName''', '''      configValue("ui.labels.entity", "Entity"),
              entityName''')
          replace('''      "Territorio",
              territory''', '''      configValue("ui.labels.territory", "Territory"),
              territory''')

          replace('''        const thumb = media && media.thumbnail ? media.thumbnail : "logo.svg";''', '''        const thumb = media && media.thumbnail ? media.thumbnail : configuredLogo();''')
          replace('''            <span class="channel-option-program">${escapeText(program && program.name ? program.name : "Programación")}</span>
                    <span class="channel-option-title">${escapeText(media && media.title ? media.title : "Programación en preparación")}</span>''', '''            <span class="channel-option-program">${escapeText(program && program.name ? program.name : configValue("ui.programming_placeholder", "Programming"))}</span>
                    <span class="channel-option-title">${escapeText(media && media.title ? media.title : configValue("ui.standby_message", "Programming in preparation"))}</span>''')

          replace('''      $("channelNumber").textContent = channel.channel_number ? `CANAL ${channel.channel_number}` : "CANAL";''', '''      const channelLabel = configValue("ui.channel_label", "CHANNEL");
              $("channelNumber").textContent = channel.channel_number ? `${channelLabel} ${channel.channel_number}` : channelLabel;''')
          replace('''    $("currentProgram").textContent = program && program.name ? program.name : "Programación";''', '''    $("currentProgram").textContent = program && program.name ? program.name : configValue("ui.current_program", "Programming");''')
          replace('''    if (copy) copy.textContent = "Programación en preparación";''', '''    if (copy) copy.textContent = configValue("ui.standby_message", "Programming in preparation");''')
          replace('''    $("standbyProgram").textContent = programName || "Programación";''', '''    $("standbyProgram").textContent = programName || configValue("ui.standby_program", "Programming");''')
          replace('''    if (copy) copy.textContent = "ARCHIPIÉLAGO VIVO TV";
              $("standbyProgram").textContent = "Continuamos en breves instantes";''', '''    if (copy) copy.textContent = configValue("ui.intermission.brand_line", appConfig.name || "TV App");
              $("standbyProgram").textContent = configValue("ui.intermission.continue_message", "We will continue shortly");''')
          replace('''      $("entityName").textContent = entity.name || media.title || "Ver ficha";''', '''      $("entityName").textContent = entity.name || media.title || configValue("ui.entity_fallback_name", "View profile");''')
          replace('''        const thumb = change.next_media && change.next_media.thumbnail ? change.next_media.thumbnail : "logo.svg";''', '''        const thumb = change.next_media && change.next_media.thumbnail ? change.next_media.thumbnail : configuredLogo();''')
          replace('''      if (countdown) countdown.textContent = `EN ${String(remaining).padStart(2, "0")} s`;''', '''      if (countdown) countdown.textContent = `${configValue("ui.continuity.countdown_prefix", "IN")} ${String(remaining).padStart(2, "0")} s`;''')

          replace('''    if (!quiet) setStatus("Cargando parrilla…", true);''', '''    if (!quiet) setStatus(configValue("ui.loading_schedule", "Loading schedule…"), true);''')
          replace('''        throw new Error("El endpoint TV todavía no está publicando schema_version 2.");''', '''        throw new Error(configValue("ui.errors.feed_schema", "The TV endpoint is not publishing a compatible schema."));''')
          replace('''      if (!selectedChannel) throw new Error("No hay canales activos.");''', '''      if (!selectedChannel) throw new Error(configValue("ui.errors.no_channels", "There are no active channels."));''')
          replace('''      if (!engine) setStatus(`No se pudo cargar la emisión: ${error.message || error}`, true);''', '''      if (!engine) setStatus(`${configValue("ui.errors.feed_load", "The broadcast could not be loaded")}: ${error.message || error}`, true);''')

          replace('''    const actionLabel = soundEnabled ? "Silenciar" : "Activar sonido";''', '''    const actionLabel = soundEnabled
              ? configValue("ui.controls.mute", "Mute")
              : configValue("ui.controls.unmute", "Unmute");''')
          replace('''    const actionLabel = active ? "Salir de pantalla completa" : "Pantalla completa";''', '''    const actionLabel = active
              ? configValue("ui.controls.exit_fullscreen", "Exit fullscreen")
              : configValue("ui.controls.fullscreen", "Fullscreen");''')
          replace('''      throw new Error("No se ha cargado el reproductor multiproveedor.");''', '''      throw new Error(configValue("ui.errors.player_missing", "The multi-provider player could not be loaded."));''')

          path.write_text(s)

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: drive frontend behavior from instance config"
          git push origin HEAD:refactor/generic-engine
