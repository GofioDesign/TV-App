name: Patch generic app v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-generic-app-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/generic-engine
          fetch-depth: 0

      - name: Patch app
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('web/app.js')
          s = p.read_text()

          # Merge the full customization tree.
          s = s.replace(
              '    branding: { ...(base.branding || {}), ...(value.branding || {}) }\n  };',
              '''    branding: { ...(base.branding || {}), ...(value.branding || {}) },
    seo: { ...(base.seo || {}), ...(value.seo || {}) },
    publisher: { ...(base.publisher || {}), ...(value.publisher || {}) },
    navigation: { ...(base.navigation || {}), ...(value.navigation || {}) },
    ui: {
      ...(base.ui || {}),
      ...(value.ui || {}),
      labels: { ...((base.ui && base.ui.labels) || {}), ...((value.ui && value.ui.labels) || {}) },
      participation: { ...((base.ui && base.ui.participation) || {}), ...((value.ui && value.ui.participation) || {}) },
      share: { ...((base.ui && base.ui.share) || {}), ...((value.ui && value.ui.share) || {}) },
      intermission: { ...((base.ui && base.ui.intermission) || {}), ...((value.ui && value.ui.intermission) || {}) },
      continuity: { ...((base.ui && base.ui.continuity) || {}), ...((value.ui && value.ui.continuity) || {}) },
      errors: { ...((base.ui && base.ui.errors) || {}), ...((value.ui && value.ui.errors) || {}) },
      controls: { ...((base.ui && base.ui.controls) || {}), ...((value.ui && value.ui.controls) || {}) }
    }
  };'''
          )

          # Prefer the shared runtime config loader.
          s = s.replace(
              'const loaded = await fetchJson("config.json");',
              'const loaded = window.TVAppConfig && window.TVAppConfig.ready ? await window.TVAppConfig.ready : await fetchJson("config.json");'
          )
          s = s.replace('log("config", `No se pudo cargar config.json:', 'log("config", `Could not load config.json:')

          # Add config helpers once.
          if 'function configValue(path' not in s:
              anchor = '''  function mediaProvider(media) {'''
              helper = '''  function configValue(path, fallback = "") {
    const parts = String(path || "").split(".").filter(Boolean);
    let value = appConfig;
    for (const part of parts) {
      if (!value || typeof value !== "object" || !(part in value)) return fallback;
      value = value[part];
    }
    return value === undefined || value === null || value === "" ? fallback : value;
  }

  function formatTemplate(template, values) {
    return String(template || "")
      .replace(/\\{([a-z0-9_]+)\\}/gi, (_, key) => values && values[key] != null ? String(values[key]) : "")
      .replace(/\\s+/g, " ")
      .trim();
  }

  function configuredLogo() {
    return firstText(configValue("branding.logo"), "assets/tv-app.svg");
  }

'''
              s = s.replace(anchor, helper + anchor)

          # Sharing and visible copy.
          s = s.replace('"una iniciativa"', 'configValue("ui.entity_fallback_name", "View profile")')
          s = s.replace('text: `Estoy viendo la presentación de ${entityName} en ${appConfig.name || "TV App"}`',
                        'text: formatTemplate(configValue("ui.share.entity_template", "I\'m watching the presentation of {entity} on {tv}"), { entity: entityName, tv: appConfig.name || "TV App" })')
          s = s.replace('"Archipiélago Vivo TV"\n    );', 'appConfig.name,\n      "TV App"\n    );')
          s = s.replace('"Canarias"\n    );', 'configValue("ui.share.default_topic")\n    );')
          s = s.replace('text: `Estoy viendo ${emission} sobre ${topic} en ${appConfig.name || "TV App"}`',
                        'text: formatTemplate(configValue("ui.share.generic_template", "I\'m watching {emission} on {tv}"), { emission, topic, tv: appConfig.name || "TV App" })')
          s = s.replace('// Compartimos un único cuerpo de texto:\n    // mensaje editorial + URL de Archipiélago Vivo TV.\n    //\n    // No adjuntamos miniaturas ni enviamos una URL separada a Web Share.\n    // La preview social debe salir de los metadatos Open Graph del subdominio.',
                        '// Share one editorial text body plus the configured TV URL.\n    // Social previews come from the instance Open Graph metadata.')
          s = s.replace('button.textContent = "Enlace copiado";', 'button.textContent = configValue("ui.share.copied", "Link copied");')
          s = s.replace('"Copia este contenido para compartir la emisión:",', 'configValue("ui.share.copy_prompt", "Copy this content to share the broadcast:"),')

          # Analytics adapter is configured by name instead of hardcoded.
          s = re.sub(
              r'''  function trackTv\(eventName, details = \{\}, includeTechnical = false\) \{\n    if \(!window\.AVAnalytics \|\| typeof window\.AVAnalytics\.track !== "function"\) return false;\n    return window\.AVAnalytics\.track\(\n      eventName,\n      includeTechnical \? \{ \.\.\.technicalContext\(\), \.\.\.details \} : details\n    \);\n  \}''',
              '''  function trackTv(eventName, details = {}, includeTechnical = false) {
    const analytics = appConfig.analytics || {};
    if (analytics.enabled === false || !analytics.global_object) return false;
    const tracker = window[analytics.global_object];
    const method = analytics.track_method || "track";
    if (!tracker || typeof tracker[method] !== "function") return false;
    return tracker[method](
      eventName,
      includeTechnical ? { ...technicalContext(), ...details } : details
    );
  }''',
              s
          )

          # Information panel labels.
          s = s.replace('channel.channel_number ? `CANAL ${channel.channel_number}` : ""', 'channel.channel_number ? `${configValue("ui.channel_label", "CHANNEL")} ${channel.channel_number}` : ""')
          s = s.replace('"Canal",\n      channelText', 'configValue("ui.labels.channel", "Channel"),\n      channelText')
          s = s.replace('"Programa",\n      program && firstText(', 'configValue("ui.labels.program", "Programme"),\n      program && firstText(')
          s = s.replace('"Ahora",\n      media && firstText(', 'configValue("ui.labels.now", "Now"),\n      media && firstText(')
          s = s.replace('`${firstText(media && media.title, media && media.name, "Vídeo")} · abrir vídeo original`',
                        'formatTemplate(configValue("ui.media_original_aria_template", "{title} · open original video"), { title: firstText(media && media.title, media && media.name, configValue("ui.video_label", "Video")) })')
          s = s.replace('"Entidad",\n      entityName', 'configValue("ui.labels.entity", "Entity"),\n      entityName')
          s = s.replace('"Territorio",\n      territory', 'configValue("ui.labels.territory", "Territory"),\n      territory')

          # Branding and generic placeholders.
          s = s.replace('media && media.thumbnail ? media.thumbnail : "logo.svg"', 'media && media.thumbnail ? media.thumbnail : configuredLogo()')
          s = s.replace('change.next_media && change.next_media.thumbnail ? change.next_media.thumbnail : "logo.svg"', 'change.next_media && change.next_media.thumbnail ? change.next_media.thumbnail : configuredLogo()')
          s = s.replace('program && program.name ? program.name : "Programación"', 'program && program.name ? program.name : configValue("ui.programming_placeholder", "Programming")')
          s = s.replace('media && media.title ? media.title : "Programación en preparación"', 'media && media.title ? media.title : configValue("ui.standby_message", "Programming in preparation")')
          s = s.replace('$("channelNumber").textContent = channel.channel_number ? `CANAL ${channel.channel_number}` : "CANAL";',
                        'const channelLabel = configValue("ui.channel_label", "CHANNEL");\n      $("channelNumber").textContent = channel.channel_number ? `${channelLabel} ${channel.channel_number}` : channelLabel;')
          s = s.replace('$("currentProgram").textContent = program && program.name ? program.name : "Programación";', '$("currentProgram").textContent = program && program.name ? program.name : configValue("ui.current_program", "Programming");')
          s = s.replace('if (copy) copy.textContent = "Programación en preparación";', 'if (copy) copy.textContent = configValue("ui.standby_message", "Programming in preparation");')
          s = s.replace('$("standbyProgram").textContent = programName || "Programación";', '$("standbyProgram").textContent = programName || configValue("ui.standby_program", "Programming");')
          s = s.replace('if (copy) copy.textContent = "ARCHIPIÉLAGO VIVO TV";', 'if (copy) copy.textContent = configValue("ui.intermission.brand_line", appConfig.name || "TV App");')
          s = s.replace('$("standbyProgram").textContent = "Continuamos en breves instantes";', '$("standbyProgram").textContent = configValue("ui.intermission.continue_message", "We will continue shortly");')
          s = s.replace('entity.name || media.title || "Ver ficha"', 'entity.name || media.title || configValue("ui.entity_fallback_name", "View profile")')
          s = s.replace('`EN ${String(remaining).padStart(2, "0")} s`', '`${configValue("ui.continuity.countdown_prefix", "IN")} ${String(remaining).padStart(2, "0")} s`')

          # Status/errors and controls.
          s = s.replace('setStatus("Cargando parrilla…", true)', 'setStatus(configValue("ui.loading_schedule", "Loading schedule…"), true)')
          s = s.replace('throw new Error("El endpoint TV todavía no está publicando schema_version 2.")', 'throw new Error(configValue("ui.errors.feed_schema", "The TV endpoint is not publishing a compatible schema."))')
          s = s.replace('throw new Error("No hay canales activos.")', 'throw new Error(configValue("ui.errors.no_channels", "There are no active channels."))')
          s = s.replace('setStatus(`No se pudo cargar la emisión: ${error.message || error}`, true)', 'setStatus(`${configValue("ui.errors.feed_load", "The broadcast could not be loaded")}: ${error.message || error}`, true)')
          s = s.replace('const actionLabel = soundEnabled ? "Silenciar" : "Activar sonido";', 'const actionLabel = soundEnabled ? configValue("ui.controls.mute", "Mute") : configValue("ui.controls.unmute", "Unmute");')
          s = s.replace('const actionLabel = active ? "Salir de pantalla completa" : "Pantalla completa";', 'const actionLabel = active ? configValue("ui.controls.exit_fullscreen", "Exit fullscreen") : configValue("ui.controls.fullscreen", "Fullscreen");')
          s = s.replace('throw new Error("No se ha cargado el reproductor multiproveedor.")', 'throw new Error(configValue("ui.errors.player_missing", "The multi-provider player could not be loaded."))')

          p.write_text(s)

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove instance copy from frontend engine"
          git push origin HEAD:refactor/generic-engine
