name: Audit instance neutrality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-instance-neutral.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/generic-engine
          fetch-depth: 0
      - name: Audit generic engine
        run: |
          {
            echo '# Instance hardcode audit'
            echo
            echo 'The following matches are outside presets/ and must be reviewed:'
            echo
            grep -RniE 'Archipi[eé]lago Vivo|archipielagovivo|ARCHIPI[EÉ]LAGO VIVO|AVAnalytics' web apps-script scripts docs 2>/dev/null || true
          } > instance-hardcode-audit.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instance-hardcode-audit.txt
          git commit -m "chore: audit remaining instance hardcodes" || exit 0
          git push origin HEAD:refactor/generic-engine
