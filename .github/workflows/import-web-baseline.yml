name: Import current Archipielago Vivo TV baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-web-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-web-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV App
        uses: actions/checkout@v4

      - name: Clone current Archipielago Vivo TV
        run: |
          rm -rf /tmp/archipielago-vivo-tv
          git clone --depth 1 https://github.com/ArchipielagoVivo/tv.git /tmp/archipielago-vivo-tv

      - name: Import frontend into web
        run: |
          mkdir -p web
          find web -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/archipielago-vivo-tv/ web/

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          if git diff --cached --quiet; then
            echo "Frontend baseline already matches source."
            exit 0
          fi
          git commit -m "baseline: import current Archipielago Vivo TV frontend"
          git push
