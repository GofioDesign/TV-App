name: Validate TV App

on:
  push:
    branches:
      - main
      - feature/android-tv-client
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check web/runtime-config.js
          node --check web/app.js
          node --check web/tv-engine.js
          node --check web/tv-player.js
          node --check scripts/build-instance.js

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('web/config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('web/config.example.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('presets/archipielago-vivo/app.config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps-script/appsscript.json','utf8'))"

      - name: Build generic instance
        run: node scripts/build-instance.js web/config.json dist/ci-generic

      - name: Build reference preset
        run: node scripts/build-instance.js presets/archipielago-vivo/app.config.json dist/ci-archipielago-vivo

      - name: Verify generated outputs
        run: |
          test -f dist/ci-generic/web/config.json
          test -f dist/ci-generic/apps-script/00_Instance_Config.gs
          test -f dist/ci-archipielago-vivo/web/config.json
          test -f dist/ci-archipielago-vivo/web/CNAME
          test -f dist/ci-archipielago-vivo/apps-script/00_Instance_Config.gs
          grep -q 'Archipiélago Vivo TV' dist/ci-archipielago-vivo/apps-script/00_Instance_Config.gs
          grep -q 'tv.archipielagovivo.org' dist/ci-archipielago-vivo/web/CNAME

      - name: Validate Android TV scaffold
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('clients/android-tv')
          required = [
              root / 'settings.gradle.kts',
              root / 'build.gradle.kts',
              root / 'app/build.gradle.kts',
              root / 'app/src/main/AndroidManifest.xml',
              root / 'app/src/main/res/values/strings.xml',
              root / 'app/src/main/res/values/styles.xml',
              root / 'app/src/main/res/drawable/tv_banner.xml',
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f'Missing Android TV scaffold file: {path}')

          for path in required[3:]:
              ET.parse(path)

          manifest = (root / 'app/src/main/AndroidManifest.xml').read_text()
          if 'android.intent.category.LEANBACK_LAUNCHER' not in manifest:
              raise SystemExit('Android TV launcher category is missing')
          if 'android.hardware.touchscreen' not in manifest or 'android:required="false"' not in manifest:
              raise SystemExit('Touchscreen must be optional for Android TV')

          gradle = (root / 'app/build.gradle.kts').read_text()
          if 'tvAppConfig' not in gradle or 'app.config.json' not in gradle:
              raise SystemExit('Android TV build is not wired to the shared app.config.json contract')
          PY

      - name: Ensure generic engine has no instance hardcodes
        run: |
          ! grep -RniE 'Archipi[eé]lago Vivo|archipielagovivo|ARCHIPI[EÉ]LAGO VIVO|AVAnalytics' web apps-script scripts \
            --exclude='config.example.json'
          ! grep -RniE 'Archipi[eé]lago Vivo|archipielagovivo|ARCHIPI[EÉ]LAGO VIVO|AVAnalytics' clients/android-tv/app
