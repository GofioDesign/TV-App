name: Diagnose generic frontend patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-patch-generic-app.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/generic-engine
          fetch-depth: 0
      - name: Diagnose
        shell: python
        run: |
          from pathlib import Path
          import traceback
          report = []
          try:
              s = Path('web/app.js').read_text()
              report.append('app_bytes=' + str(len(s)))
              needles = [
                  'Archipiélago Vivo TV',
                  'window.AVAnalytics',
                  'ARCHIPIÉLAGO VIVO TV',
                  'const loaded = await fetchJson("config.json");',
                  'branding: { ...(base.branding || {}), ...(value.branding || {}) }'
              ]
              for needle in needles:
                  report.append(repr(needle) + '=' + str(s.count(needle)))
          except Exception:
              report.append(traceback.format_exc())
          Path('patch-debug.txt').write_text('\n'.join(report) + '\n')
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-debug.txt
          git commit -m "chore: add temporary patch diagnostics" || exit 0
          git push origin HEAD:refactor/generic-engine
